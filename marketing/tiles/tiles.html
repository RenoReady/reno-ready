<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reno Ready — tile swatch renderer</title>
<style>
  body{margin:0;padding:24px;background:#eee;font:13px system-ui;display:flex;flex-wrap:wrap;gap:16px}
  figure{margin:0;text-align:center} canvas{display:block;width:200px;height:200px;border-radius:12px}
</style>
</head>
<body>
<script>
/*
 * Procedural, photo-style tile swatches. Every material is rendered per pixel:
 * value-noise textures (veins, glaze, pits, grain), per-tile colour variation,
 * grout, cushion-edge bevels and soft studio lighting. tiles.mjs screenshots each
 * canvas to public/tiles/<id>.webp.
 */
const S = 400;

// ── noise ───────────────────────────────────────────────────────
function mulberry(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const R = mulberry(seed), g = new Float32Array(65536);
  for (let i = 0; i < g.length; i++) g[i] = R();
  const at = (x, y) => g[((y & 255) << 8) | (x & 255)];
  const n = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const fbm = (x, y, o = 5) => { let s = 0, a = .5, f = 1, t = 0; for (let i = 0; i < o; i++) { s += a * n(x * f + i * 17.3, y * f + i * 9.1); t += a; a *= .5; f *= 2; } return s / t; };
  const ridged = (x, y, o = 5) => { let s = 0, a = .5, f = 1, t = 0; for (let i = 0; i < o; i++) { s += a * (1 - Math.abs(2 * n(x * f + i * 7.7, y * f + i * 3.3) - 1)); t += a; a *= .5; f *= 2; } return s / t; };
  return { n, fbm, ridged, R };
}
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

/**
 * Lays tiles over the canvas and shades every pixel.
 *  surface(x, y, t) → [r,g,b] for the tile face; t = { id, lx, ly, tw, th, rnd }
 */
function tiled(ctx, o, surface) {
  const { tw, th, gap = 3, grout = [214, 208, 198], offset = false, bevel = 5, bevelK = .22,
          gloss = 0, sheen = 0, irregular = 0, noise } = o;
  const N = noise, img = ctx.createImageData(S, S), d = img.data;
  const cache = new Map();
  const tileRnd = (id) => { if (!cache.has(id)) { const r = mulberry(id * 9301 + 49297); cache.set(id, [r(), r(), r(), r(), r()]); } return cache.get(id); };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const row = Math.floor(y / th), ox = offset && row % 2 ? tw / 2 : 0;
    const col = Math.floor((x + ox) / tw);
    const lx = x + ox - col * tw, ly = y - row * th, id = row * 131 + col + 7;
    const rnd = tileRnd(id);
    // edge distances, wobbled for handmade tiles
    const w = irregular ? (N.n(x * .09, y * .09) - .5) * irregular : 0;
    const dT = ly - gap / 2 + w, dL = lx - gap / 2 - w, dB = th - ly - gap / 2 - w, dR = tw - lx - gap / 2 + w;
    let c;
    if (dT < 0 || dL < 0 || dB < 0 || dR < 0) {
      const gn = (N.n(x * .6, y * .6) - .5) * 10;
      c = [grout[0] + gn, grout[1] + gn, grout[2] + gn];
      // grout sits slightly in shadow
      c = c.map((v) => v * .92);
    } else {
      c = surface(x, y, { id, lx, ly, tw, th, rnd, dT, dL, dB, dR });
      // cushion bevel: lit top/left, shaded bottom/right
      if (bevel > 0) {
        const lit = (1 - smooth(0, bevel, dT)) * bevelK + (1 - smooth(0, bevel, dL)) * bevelK * .7;
        const shd = (1 - smooth(0, bevel, dB)) * bevelK * 1.2 + (1 - smooth(0, bevel, dR)) * bevelK * .9;
        const k = 1 + lit - shd;
        c = [c[0] * k + lit * 40, c[1] * k + lit * 40, c[2] * k + lit * 40];
      }
      // soft specular per tile (glazed / polished)
      if (gloss > 0) {
        const cx = tw * (.22 + rnd[1] * .2), cy = th * (.18 + rnd[2] * .18), sg = Math.max(tw, th) * .32;
        const sp = Math.exp(-((lx - cx) ** 2 + (ly - cy) ** 2) / (2 * sg * sg)) * gloss;
        c = c.map((v) => v + sp * 255 * .55);
      }
    }
    // a window reflection running diagonally across glossy surfaces
    if (sheen > 0) {
      const band = Math.exp(-((x * .8 - y + 70) ** 2) / (2 * 55 * 55)) * sheen;
      c = c.map((v) => v + band * 255 * .35);
    }
    const i = (y * S + x) * 4;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

/** Soft studio light: brighter top-left, gentle fall-off to the bottom-right */
function studio(ctx, k = 1) {
  const g = ctx.createLinearGradient(0, 0, S, S);
  g.addColorStop(0, `rgba(255,255,255,${.10 * k})`);
  g.addColorStop(.5, "rgba(255,255,255,0)");
  g.addColorStop(1, `rgba(0,0,0,${.16 * k})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  const v = ctx.createRadialGradient(S * .45, S * .4, S * .3, S * .5, S * .5, S * .8);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${.12 * k})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, S, S);
}

// ── material surfaces ───────────────────────────────────────────
function stoneFace(N, base, { band = 0, bandAmp = 0, mottle = 10, fine = 6, warmth = [1, .96, .88] } = {}) {
  return (x, y, t) => {
    const tone = (t.rnd[0] - .5) * 14;
    let v = (N.fbm(x * .006 + t.id, y * .006) - .5) * mottle * 2 + (N.n(x * .5, y * .5) - .5) * fine * 2 + tone;
    if (band) v += (N.fbm(x * .0035 + N.fbm(x * .01, y * .01) * 1.5, y * band) - .5) * bandAmp * 2;
    return [base[0] + v * warmth[0], base[1] + v * warmth[1], base[2] + v * warmth[2]];
  };
}
function marbleFace(N, base, vein, { scale = 1, strength = 1, tone = 6 } = {}) {
  return (x, y, t) => {
    const X = x / scale + t.rnd[0] * 300, Y = y / scale;
    // main vein field: diagonal flow, gently warped
    const flow = X * .0024 + Y * .0015 + N.fbm(X * .0024, Y * .0024, 5) * 2.4 + N.fbm(X * .009, Y * .009, 3) * .25;
    const m1 = Math.abs(Math.sin(flow * Math.PI * 1.15));
    const width = .55 + N.fbm(X * .006 + 40, Y * .006, 3) * .9;            // veins thicken and fade along their length
    const main = Math.pow(1 - m1, 24 / width) * (.3 + N.fbm(X * .004, Y * .004 + 20, 3) * .8);
    const halo = Math.pow(1 - m1, 5) * .12;
    // fine secondary threads crossing the main veins
    const f2 = X * .0016 - Y * .0058 + N.fbm(X * .004 + 9, Y * .004, 4) * 1.4;
    const m2 = Math.abs(Math.sin(f2 * Math.PI * 3.3));
    const thread = Math.pow(1 - m2, 70) * .5 * N.fbm(X * .008, Y * .008 + 5, 3);
    const v = clamp01((main + halo + thread) * strength);
    const cloud = (N.fbm(X * .006, Y * .006 + 9, 4) - .5) * tone * 2;
    const c = mix(base, vein, v);
    return [c[0] + cloud, c[1] + cloud, c[2] + cloud * .95];
  };
}
function glazeFace(N, base, { jitter = 10, wave = 16, pool = 34, spec = .55, hueShift = [0, 0, 0] } = {}) {
  return (x, y, t) => {
    const j = (t.rnd[0] - .5) * jitter * 2, h = (t.rnd[3] - .5);
    let c = [base[0] + j + h * hueShift[0], base[1] + j + h * hueShift[1], base[2] + j + h * hueShift[2]];
    // undulating hand-glazed surface
    const wv = (N.fbm(x * .028 + t.id * 3.1, y * .028, 4) - .5) * wave * 2;
    c = c.map((v) => v + wv);
    // glaze pools darker toward the tile edges
    const de = Math.min(t.dT, t.dL, t.dB, t.dR);
    const p = (1 - smooth(0, 13, de)) * pool * (.7 + N.n(x * .2, y * .2) * .6);
    c = c.map((v) => v - p);
    // broken specular glints where the glaze crests
    const crest = N.fbm(x * .07 + t.id, y * .07 + 3, 3);
    const s = Math.pow(clamp01((crest - .6) * 3.6), 4) * spec * 255;
    return c.map((v) => v + s);
  };
}
function chipsLayer(ctx, N, seed, palette, { count = 240, min = 2.5, max = 11, specks = 900 } = {}) {
  const R = mulberry(seed);
  for (let i = 0; i < specks; i++) {
    ctx.fillStyle = palette[Math.floor(R() * palette.length)] + "88";
    ctx.beginPath(); ctx.arc(R() * S, R() * S, .5 + R() * 1.2, 0, 7); ctx.fill();
  }
  for (let i = 0; i < count; i++) {
    const cx = R() * S, cy = R() * S, r = min + Math.pow(R(), 2.2) * (max - min), k = 5 + Math.floor(R() * 3), a0 = R() * 7;
    const col = palette[Math.floor(R() * palette.length)];
    ctx.beginPath();
    for (let j = 0; j < k; j++) { const a = a0 + (j / k) * Math.PI * 2, rr = r * (.55 + R() * .6); j ? ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    g.addColorStop(0, col); g.addColorStop(1, shade(col, -.18));
    ctx.fillStyle = g; ctx.fill();
  }
}
function shade(h, k) { const c = hex(h).map((v) => Math.max(0, Math.min(255, Math.round(v * (1 + k))))); return `#${c.map((v) => v.toString(16).padStart(2, "0")).join("")}`; }
function groutLines(ctx, { cols, rows, gap = 3, color = "rgba(205,198,186,1)" }) {
  ctx.fillStyle = color;
  for (let i = 1; i < cols; i++) ctx.fillRect(i * S / cols - gap / 2, 0, gap, S);
  for (let i = 1; i < rows; i++) ctx.fillRect(0, i * S / rows - gap / 2, S, gap);
}
function pits(ctx, seed, count, col) {
  const R = mulberry(seed);
  for (let i = 0; i < count; i++) {
    const x = R() * S, y = R() * S, rx = 1.2 + Math.pow(R(), 2.4) * 8, ry = rx * (.16 + R() * .22);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
    g.addColorStop(0, `rgba(${col},.55)`); g.addColorStop(.7, `rgba(${col},.3)`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, (R() - .5) * .3, 0, 7); ctx.fill();
  }
}
function polish(ctx, k = .18) {
  const g = ctx.createLinearGradient(0, 0, S, S * .9);
  g.addColorStop(.18, "rgba(255,255,255,0)"); g.addColorStop(.32, `rgba(255,255,255,${k})`); g.addColorStop(.46, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
}

// timber plank texture into an offscreen canvas
function plank(N, w, h, seed, base = [204, 160, 110], dark = [150, 104, 64]) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"), img = ctx.createImageData(w, h), d = img.data;
  const R = mulberry(seed), off = R() * 100, tone = (R() - .5) * 26;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const gx = x + off * 13, gy = y + off;
    const warp = N.fbm(gx * .004, gy * .05, 4) * 28;
    const freq = .32 + (seed % 7) * .03;
    const ring = Math.pow(Math.sin((gy * 1.2 + warp * 2.2 + N.fbm(gx * .02, gy * .02, 2) * 9) * freq) * .5 + .5, 6) * .3;
    const fibre = (N.n(gx * .02, gy * 1.4) - .5) * 12;
    const knot = Math.pow(clamp01(1 - Math.hypot((x - w * (.3 + (seed % 5) * .1)) / 9, (y - h * .5) / 5) / 2.4), 2) * .6;
    const t = clamp01(ring + (N.fbm(gx * .005, gy * .03, 5) - .5) * .9 + .2 + knot * .7);
    const col = mix(base, dark, t);
    const i = (y * w + x) * 4;
    d[i] = col[0] + fibre + tone; d[i + 1] = col[1] + fibre * .8 + tone * .8; d[i + 2] = col[2] + fibre * .6 + tone * .6; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // eased edges between boards
  const e = ctx.createLinearGradient(0, 0, 0, h);
  e.addColorStop(0, "rgba(255,240,220,.22)"); e.addColorStop(.08, "rgba(255,240,220,0)"); e.addColorStop(.9, "rgba(0,0,0,0)"); e.addColorStop(1, "rgba(40,20,5,.35)");
  ctx.fillStyle = e; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(55,35,18,.32)"; ctx.lineWidth = 1.2; ctx.strokeRect(.7, .7, w - 1.4, h - 1.4);
  return c;
}

// ── reusable tone painters ──────────────────────────────────────
function oakFloor(ctx, seed, base, dark) {
  const N = makeNoise(seed), R = mulberry(seed * 3 + 1), h = 80;
  for (let row = 0; row < S / h; row++) {
    let x = -R() * 160;
    while (x < S) { const w = 190 + R() * 140; ctx.drawImage(plank(N, Math.round(w), h, row * 50 + Math.round(x), base, dark), x, row * h); x += w; }
  }
  polish(ctx, .08); studio(ctx, .9);
}
function concrete(ctx, seed, baseHex, { seam = false } = {}) {
  const N = makeNoise(seed), base = hex(baseHex);
  tiled(ctx, { tw: 400, th: seam ? 200 : 400, gap: seam ? 3 : 0, grout: base.map((v) => v * .78), bevel: seam ? 3 : 0, bevelK: .08, noise: N },
    (x, y, t) => {
      const v = (N.fbm(x * .005, y * .005 + t.id) - .5) * 30 + (N.fbm(x * .03, y * .03, 4) - .5) * 14 + (N.n(x * .9, y * .9) - .5) * 10;
      return [base[0] + v, base[1] + v * .98, base[2] + v * .95];
    });
  const R = mulberry(seed + 5);
  for (let i = 0; i < 150; i++) { const x = R() * S, y = R() * S, r = .6 + R() * 1.3; ctx.fillStyle = "rgba(40,38,36,.45)"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.22)"; ctx.beginPath(); ctx.arc(x + r * .5, y + r * .5, r * .5, 0, 7); ctx.fill(); }
  polish(ctx, .1); studio(ctx, .8);
}
function subway(ctx, seed, rgb, grout = "#EEEBE4") {
  const N = makeNoise(seed);
  tiled(ctx, { tw: 100, th: 50, gap: 3, grout: hex(grout), offset: true, bevel: 6, bevelK: .24, gloss: .32, sheen: .3, noise: N },
    (x, y, t) => { const j = (t.rnd[0] - .5) * 14, g = (N.fbm(x * .03 + t.id, y * .05, 3) - .5) * 12; return [rgb[0] + j + g, rgb[1] + j + g, rgb[2] + j * .9 + g]; });
  studio(ctx, .8);
}
function fluted(ctx, seed, tint) {
  const N = makeNoise(seed), f = 26, img = ctx.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const ph = (x % f) / f, nx = -Math.cos(ph * Math.PI), nz = Math.sin(ph * Math.PI);
    const diff = clamp01(-nx * .55 + nz * .8 + .15), spec = Math.pow(clamp01(-nx * .5 + nz * .86), 40) * .4;
    const groove = 1 - (1 - smooth(0, .06, Math.min(ph, 1 - ph))) * .5;
    const seam = Math.abs((y % 200) - 1.5) < 1.5 ? .8 : 1, tone = (N.n(x * .3, y * .3) - .5) * 5;
    const l = (.6 + .4 * diff) * groove * seam;
    const i = (y * S + x) * 4;
    d[i] = tint[0] * l + spec * 255 + tone; d[i + 1] = tint[1] * l + spec * 255 + tone; d[i + 2] = tint[2] * l + spec * 255 + tone; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); studio(ctx, .6);
}
// polished Venetian plaster / limewash: soft clouds with trowel-burnished sheen
function plaster(ctx, seed, baseHex, { sheen = .5, cloud = 18, chalk = 0 } = {}) {
  const N = makeNoise(seed), base = hex(baseHex), img = ctx.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const c = (N.fbm(x * .004, y * .004, 6) - .5) * cloud * 2 + (N.fbm(x * .015 + 9, y * .015, 4) - .5) * cloud * .7;
    const u = (x + y) * .7, w = (y - x) * .7;
    const stroke = N.fbm(u * .0045 + N.fbm(x * .006, y * .006, 4) * 1.6, w * .009, 5);
    const burnish = Math.pow(clamp01((stroke - .46) * 1.7), 2.2) * sheen * 34;
    const grain = (N.n(x * .9, y * .9) - .5) * (4 + chalk * 8);
    const i = (y * S + x) * 4;
    d[i] = base[0] + c + burnish + grain; d[i + 1] = base[1] + c + burnish + grain; d[i + 2] = base[2] + c * .95 + burnish + grain; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); studio(ctx, .7);
}
function carpet(ctx, seed, baseHex) {
  const N = makeNoise(seed), base = hex(baseHex), img = ctx.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const loop = (N.n(x * 1.3, y * 1.3) - .5) * 26 + Math.sin(y * 1.6 + N.n(x * .2, y * .2) * 3) * 5;
    const mottle = (N.fbm(x * .01, y * .01, 4) - .5) * 14, fleck = N.n(x * 2.1 + 5, y * 2.1) > .86 ? 14 : 0;
    const i = (y * S + x) * 4;
    d[i] = base[0] + loop + mottle + fleck; d[i + 1] = base[1] + loop + mottle + fleck; d[i + 2] = base[2] + loop * .95 + mottle + fleck; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); studio(ctx, .8);
}
function vjPanel(ctx, seed, baseHex) {
  const N = makeNoise(seed), base = hex(baseHex), w = 50, img = ctx.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const lx = x % w, v = lx < 3 ? -46 + lx * 8 : lx > w - 3 ? -18 : 0;   // V-groove, lit on one side
    const grain = (N.fbm(x * .02, y * .004, 3) - .5) * 6, tone = (N.n(x * .5, y * .5) - .5) * 4;
    const i = (y * S + x) * 4;
    d[i] = base[0] + v + grain + tone; d[i + 1] = base[1] + v + grain + tone; d[i + 2] = base[2] + v + grain * .9 + tone; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); polish(ctx, .06); studio(ctx, .75);
}

// ── materials ───────────────────────────────────────────────────
const M = {
  /* ── floor tiles ── */
  "travertine"(ctx) {
    const N = makeNoise(11), base = hex("#E5D6BE");
    tiled(ctx, { tw: 200, th: 200, gap: 3, grout: hex("#D9CDB9"), bevel: 3, bevelK: .12, noise: N },
      stoneFace(N, base, { band: .05, bandAmp: 22, mottle: 9, fine: 5 }));
    pits(ctx, 21, 46, "176,146,108"); studio(ctx, .8);
  },
  "desert-stone"(ctx) {
    const N = makeNoise(12), base = hex("#C79E6C");
    tiled(ctx, { tw: 200, th: 200, gap: 3, grout: hex("#CDBFA6"), bevel: 3, bevelK: .14, noise: N },
      (x, y, t) => {
        const strata = (N.fbm(x * .004 + N.fbm(x * .02, y * .02) * 2, y * .022) - .5) * 52;
        const sp = (N.n(x * .7, y * .7) - .5) * 26 + (t.rnd[0] - .5) * 18;
        const iron = Math.pow(N.ridged(x * .008 + 4, y * .02, 4), 6) * 40;
        return [base[0] + strata + sp - iron * .2, base[1] + strata * .85 + sp - iron * .6, base[2] + strata * .6 + sp - iron];
      });
    studio(ctx, .9);
  },
  "charcoal-slate"(ctx) {
    const N = makeNoise(13), base = hex("#3E4146");
    const hgt = (x, y) => N.fbm(x * .012, y * .035, 6) * .6 + N.ridged(x * .02, y * .05, 4) * .4;
    tiled(ctx, { tw: 200, th: 200, gap: 4, grout: hex("#222428"), bevel: 3, bevelK: .1, noise: N },
      (x, y, t) => {

/* ── style-first pickers: every style rendered in every tone ──────────
 * Floor and wall tile styles × the five shared tones  → <style>--<tone>
 * Paint finishes × their palette colours             → paint-<finish>--<tone>
 * Keep these lists in step with FLOOR_FORMATS / WALL_FORMATS / PAINT_FINISHES in src/lib/types.ts.
 */
const TONE_HEX = { "warm-white": "#ECE5D8", "light-grey": "#C7C8C6", charcoal: "#3C3D40", sand: "#CDB48F", sage: "#9DAC95" };
const isDark = (rgb) => rgb[0] * .3 + rgb[1] * .59 + rgb[2] * .11 < 110;
const scale = (rgb, k) => rgb.map((v) => Math.max(0, Math.min(255, v * k)));
const toHex = (rgb) => `#${rgb.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("")}`;
const groutFor = (rgb) => isDark(rgb) ? mix(rgb, [150, 146, 140], .55) : mix(rgb, [150, 144, 134], .28);
let seedN = 900;
const nextSeed = () => ++seedN;

// a glazed rectangle drawn into an offscreen canvas, for rotated layouts
function glazedRect(N, w, h, rgb, seed) {
  w = Math.round(w); h = Math.round(h);   // ImageData rows must be whole pixels
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"), img = ctx.createImageData(w, h), d = img.data, R = mulberry(seed), j = (R() - .5) * 16;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const wv = (N.fbm(x * .03 + seed, y * .03, 3) - .5) * 14;
    const edge = Math.min(x, y, w - 1 - x, h - 1 - y), bev = edge < 3 ? (x < 3 || y < 3 ? 22 : -26) * (1 - edge / 3) : 0;
    const sp = Math.exp(-(((x - w * .3) ** 2) / (2 * (w * .3) ** 2) + ((y - h * .3) ** 2) / (2 * (h * .5) ** 2))) * 40;
    const i = (y * w + x) * 4;
    d[i] = rgb[0] + j + wv + bev + sp; d[i + 1] = rgb[1] + j + wv + bev + sp; d[i + 2] = rgb[2] + j * .9 + wv + bev + sp; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

const FLOOR_STYLE_PAINTERS = {
  "marble-stone"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    const vein = isDark(rgb) ? [214, 211, 205] : mix(rgb, [98, 94, 90], .62);
    tiled(ctx, { tw: 400, th: 200, gap: 2, grout: groutFor(rgb), bevel: 3, bevelK: .08, gloss: .08, noise: N },
      marbleFace(N, rgb, vein, { scale: 1.5, strength: isDark(rgb) ? .6 : .75, tone: 5 }));
    polish(ctx, .18); studio(ctx, .7);
  },
  "terrazzo"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    tiled(ctx, { tw: 400, th: 400, gap: 0, bevel: 0, noise: N }, stoneFace(N, rgb, { mottle: 4, fine: 4 }));
    const chips = isDark(rgb)
      ? ["#9A9C9F", "#D9D6D0", "#6E7074", "#B9A58A", "#F0EDE6", "#585A5E"]
      : [toHex(scale(rgb, .62)), toHex(scale(rgb, .8)), toHex(mix(rgb, [255, 255, 255], .5)), "#8D9196", "#D8CBB6", "#3A3B3E"];
    chipsLayer(ctx, N, seed + 3, chips, { count: 250 });
    groutLines(ctx, { cols: 2, rows: 2, gap: 2.5, color: toHex(groutFor(rgb)) });
    polish(ctx, .14); studio(ctx, .8);
  },
  "concrete-slate"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    const hgt = (x, y) => N.fbm(x * .012, y * .03, 5) * .7 + N.ridged(x * .02, y * .05, 3) * .3;
    tiled(ctx, { tw: 400, th: 200, gap: 3, grout: groutFor(rgb), bevel: 3, bevelK: .08, noise: N },
      (x, y, t) => {
        const relief = (hgt(x - 1, y - 1) - hgt(x + 1, y + 1)) * 140;
        const v = (N.fbm(x * .005, y * .005 + t.id) - .5) * 26 + (N.n(x * .9, y * .9) - .5) * 9 + relief + (t.rnd[0] - .5) * 8;
        return [rgb[0] + v, rgb[1] + v * .99, rgb[2] + v * .97];
      });
    const R = mulberry(seed + 5);
    for (let i = 0; i < 110; i++) { const x = R() * S, y = R() * S, r = .5 + R() * 1.2; ctx.fillStyle = "rgba(40,38,36,.35)"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
    studio(ctx, .8);
  },
  "large-format-plain"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    tiled(ctx, { tw: 400, th: 200, gap: 2, grout: groutFor(rgb), bevel: 2, bevelK: .08, gloss: .12, noise: N },
      stoneFace(N, rgb, { mottle: 4, fine: 3, warmth: [1, 1, 1] }));
    polish(ctx, .16); studio(ctx, .75);
  },
  "timber-plank"(ctx, rgb, seed) {
    const base = isDark(rgb) ? [96, 84, 72] : mix(rgb, [196, 156, 108], rgb[1] > rgb[0] ? .25 : .45);
    oakFloor(ctx, seed, base, scale(base, .72));
  },
  "encaustic"(ctx, rgb, seed) {
    const N = makeNoise(seed), T = 100;
    const dark = isDark(rgb);
    const bg = dark ? rgb : [241, 236, 226];
    const motif = dark ? [236, 230, 218] : (rgb[0] > 220 && rgb[1] > 215 ? [176, 160, 132] : scale(rgb, .82));
    ctx.fillStyle = toHex(bg); ctx.fillRect(0, 0, S, S);
    ctx.fillStyle = toHex(motif);
    for (let ty = 0; ty < S; ty += T) for (let tx = 0; tx < S; tx += T) {
      const cx = tx + T / 2, cy = ty + T / 2;
      for (const [qx, qy] of [[tx, ty], [tx + T, ty], [tx, ty + T], [tx + T, ty + T]]) { ctx.beginPath(); ctx.arc(qx, qy, T * .3, 0, 7); ctx.fill(); }
      ctx.beginPath();                                                   // four-point star
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, r = k % 2 ? T * .12 : T * .34; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.save(); ctx.fillStyle = toHex(bg); ctx.beginPath(); ctx.arc(cx, cy, T * .07, 0, 7); ctx.fill(); ctx.restore();
    }
    // matte cement texture over the print
    const img = ctx.getImageData(0, 0, S, S), d = img.data;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const v = (N.fbm(x * .02, y * .02, 4) - .5) * 14 + (N.n(x * .8, y * .8) - .5) * 8, i = (y * S + x) * 4; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
    ctx.putImageData(img, 0, 0);
    groutLines(ctx, { cols: 4, rows: 4, gap: 2, color: toHex(groutFor(bg)) });
    studio(ctx, .8);
  },
  "terracotta"(ctx, rgb, seed, tone) {
    const N = makeNoise(seed);
    // "sand" reads as natural clay for terracotta; the others are glazed clay in that tone
    const clay = tone === "sand" ? [196, 140, 98] : rgb;
    tiled(ctx, { tw: 100, th: 100, gap: 3, grout: groutFor(clay), bevel: 4, bevelK: .12, irregular: 1.6, noise: N },
      (x, y, t) => {
        const j = (t.rnd[0] - .5) * 24, h = (t.rnd[1] - .5) * 10;
        const m = (N.fbm(x * .02 + t.id, y * .02, 5) - .5) * 24 + (N.n(x * .7, y * .7) - .5) * 10;
        const burn = Math.pow(1 - smooth(0, 22, Math.min(t.dT, t.dL, t.dB, t.dR)), 2) * 16;
        return [clay[0] + j + m - burn, clay[1] + j * .7 + h + m * .8 - burn, clay[2] + j * .5 + m * .6 - burn];
      });
    studio(ctx, .85);
  },
  "small-hexagon"(ctx, rgb, seed) {
    const R = mulberry(seed), r = 17, w = Math.sqrt(3) * r, gap = 2.6;
    ctx.fillStyle = toHex(groutFor(rgb)); ctx.fillRect(0, 0, S, S);
    for (let row = -1; row * r * 1.5 < S + r; row++) for (let col = -1; col * w < S + w; col++) {
      const cx = col * w + (row % 2 ? w / 2 : 0), cy = row * r * 1.5, j = (R() - .5) * 18;
      const c = rgb.map((v) => v + j), rr = r - gap / 2;
      const g = ctx.createRadialGradient(cx - rr * .3, cy - rr * .35, rr * .1, cx, cy, rr * 1.05);
      g.addColorStop(0, toHex(c.map((v) => Math.min(255, v + 16)))); g.addColorStop(.75, toHex(c)); g.addColorStop(1, toHex(c.map((v) => v - 22)));
      ctx.fillStyle = g; ctx.beginPath();
      for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill();
    }
    polish(ctx, .1); studio(ctx, .8);
  },
};

const WALL_STYLE_PAINTERS = {
  "subway"(ctx, rgb, seed) { subway(ctx, seed, rgb, toHex(groutFor(rgb))); },
  "kitkat"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    tiled(ctx, { tw: 25, th: 100, gap: 2.4, grout: groutFor(rgb), bevel: 4, bevelK: .2, gloss: .22, sheen: .22, irregular: .5, noise: N },
      glazeFace(N, rgb, { jitter: 9, wave: 7, pool: 16, spec: .08 }));
    groutLines(ctx, { cols: 1, rows: 4, gap: 3.2, color: toHex(groutFor(rgb)) });
    studio(ctx, .8);
  },
  "zellige"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    tiled(ctx, { tw: 80, th: 80, gap: 2.5, grout: groutFor(rgb), bevel: 3, bevelK: .1, irregular: 2.2, gloss: .12, sheen: .18, noise: N },
      glazeFace(N, rgb, { jitter: isDark(rgb) ? 10 : 8, wave: 9, pool: isDark(rgb) ? 16 : 24, spec: .45, hueShift: [6, 4, -4] }));
    studio(ctx, .8);
  },
  "large-slab"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    tiled(ctx, { tw: 267, th: 400, gap: 1.5, grout: scale(rgb, .9), bevel: 1, bevelK: .05, gloss: .05, noise: N },
      stoneFace(N, rgb, { mottle: 5, fine: 2.5, warmth: [1, 1, 1] }));
    polish(ctx, .22); studio(ctx, .7);
  },
  "terrazzo-wall"(ctx, rgb, seed) {
    const N = makeNoise(seed);
    tiled(ctx, { tw: 400, th: 400, gap: 0, bevel: 0, noise: N }, stoneFace(N, rgb, { mottle: 4, fine: 4 }));
    const chips = isDark(rgb)
      ? ["#9A9C9F", "#D9D6D0", "#6E7074", "#B9A58A", "#F0EDE6"]
      : [toHex(scale(rgb, .66)), toHex(scale(rgb, .82)), toHex(mix(rgb, [255, 255, 255], .5)), "#A3A6AA", "#C9B79C"];
    chipsLayer(ctx, N, seed + 7, chips, { count: 340, min: 1.5, max: 6.5, specks: 1100 });
    groutLines(ctx, { cols: 3, rows: 3, gap: 2, color: toHex(groutFor(rgb)) });
    polish(ctx, .14); studio(ctx, .8);
  },
  "fluted"(ctx, rgb, seed) { fluted(ctx, seed, isDark(rgb) ? scale(rgb, 1.25) : rgb); },
  "herringbone-wall"(ctx, rgb, seed) {
    const N = makeNoise(seed), W = 30, L = 90, gap = 2.5;
    ctx.fillStyle = toHex(groutFor(rgb)); ctx.fillRect(0, 0, S, S);
    ctx.save(); ctx.translate(S / 2, S / 2); ctx.rotate(Math.PI / 4); ctx.translate(-S, -S);
    let k = 1;
    // staircase strips of horizontal + vertical tiles, each strip 2L wide (same geometry as the timber herringbone)
    for (let s = -4; s < 8; s++) for (let n = -6; n < 40; n++) {
      const x0 = s * 2 * L + n * W, y0 = n * W;
      ctx.drawImage(glazedRect(N, L - gap, W - gap, rgb, seed + k++), x0 + gap / 2, y0 + gap / 2);
      ctx.save(); ctx.translate(x0 + W, y0 + W); ctx.rotate(Math.PI / 2);
      ctx.drawImage(glazedRect(N, L - gap, W - gap, rgb, seed + k++), gap / 2, gap / 2); ctx.restore();
    }
    ctx.restore(); studio(ctx, .8);
  },
  "geometric"(ctx, rgb, seed) {
    const R = mulberry(seed), w = 56, h = w * .5;
    ctx.fillStyle = toHex(groutFor(rgb)); ctx.fillRect(0, 0, S, S);
    for (let row = -2; row * h < S + w; row++) for (let col = -1; col * w < S + w; col++) {
      const cx = col * w + (row % 2 ? w / 2 : 0), cy = row * h, j = (R() - .5) * 16, c = rgb.map((v) => v + j), r = w / 2 - 1.3;
      const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
      g.addColorStop(0, toHex(c.map((v) => v - 26))); g.addColorStop(.55, toHex(c)); g.addColorStop(1, toHex(c.map((v) => Math.min(255, v + 18))));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();   // each row overlaps the one above → scales
      ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.beginPath(); ctx.ellipse(cx - r * .3, cy + r * .45, r * .3, r * .1, -.3, 0, 7); ctx.fill();
    }
    studio(ctx, .8);
  },
};

const PAINT_TONE_HEX = {
  "natural-white": "#F1EEE6", "lexicon-quarter": "#EDEFEE", "hog-bristle": "#E0D3B8", "slate-grey": "#7E8489", "sage-green": "#A3B09A", "navy-charcoal": "#2F3A4A",
  "slate-blue": "#6F8296", "terracotta-clay": "#C07A57", "olive": "#7F7E57", "ochre": "#C49A4E",
  "sandstone": "#D6C19D", "clay": "#C8A486", "terracotta-blush": "#D4A08A", "olive-stone": "#A8A283", "mushroom": "#B5A898",
  "charcoal": "#3B3C3E", "forest": "#3E4F43", "deep-teal": "#2F4B4F", "aubergine": "#4A3842", "chocolate": "#4A3B30",
};
const MAIN = ["natural-white", "lexicon-quarter", "hog-bristle", "slate-grey", "sage-green", "navy-charcoal"];
const PAINT_FINISH_TONES = {
  "crisp-neutral":        MAIN,
  "venetian-microcement": MAIN,
  "feature-wall":         ["sage-green", "slate-blue", "terracotta-clay", "olive", "ochre", "navy-charcoal"],
  "soft-earth":           ["hog-bristle", "sandstone", "clay", "terracotta-blush", "olive-stone", "mushroom"],
  "limewash":             MAIN,
  "dark-moody":           ["navy-charcoal", "charcoal", "forest", "deep-teal", "aubergine", "chocolate"],
  "vj-panelling":         MAIN,
};
const PAINT_PAINTERS = {
  "crisp-neutral":        (ctx, hex, seed) => plaster(ctx, seed, hex, { sheen: .08, cloud: 3, chalk: 0 }),
  "venetian-microcement": (ctx, hex, seed) => plaster(ctx, seed, hex, { sheen: .65, cloud: 16 }),
  "feature-wall":         (ctx, hex, seed) => plaster(ctx, seed, hex, { sheen: .06, cloud: 3, chalk: 0 }),
  "soft-earth":           (ctx, hex, seed) => plaster(ctx, seed, hex, { sheen: .02, cloud: 4, chalk: .3 }),
  "limewash":             (ctx, hex, seed) => plaster(ctx, seed, hex, { sheen: .15, cloud: 24, chalk: 1 }),
  "dark-moody":           (ctx, hex, seed) => plaster(ctx, seed, hex, { sheen: .04, cloud: 3, chalk: .2 }),
  "vj-panelling":         (ctx, hex, seed) => vjPanel(ctx, seed, hex),
};

for (const [style, paint] of [...Object.entries(FLOOR_STYLE_PAINTERS), ...Object.entries(WALL_STYLE_PAINTERS)])
  for (const [tone, h] of Object.entries(TONE_HEX)) {
    const seed = nextSeed();
    M[`${style}--${tone}`] = (ctx) => paint(ctx, hex(h), seed, tone);
  }
for (const [finish, tones] of Object.entries(PAINT_FINISH_TONES))
  for (const tone of tones) { const seed = nextSeed(); M[`paint-${finish}--${tone}`] = (ctx) => PAINT_PAINTERS[finish](ctx, PAINT_TONE_HEX[tone], seed); }

window.TILE_IDS = Object.keys(M);
window.render = (id) => {
  const c = document.createElement("canvas"); c.width = c.height = S;
  M[id](c.getContext("2d"));
  return c;
};
for (const id of window.TILE_IDS) {
  const fig = document.createElement("figure");
  fig.appendChild(window.render(id));
  fig.insertAdjacentHTML("beforeend", `<figcaption>${id}</figcaption>`);
  document.body.appendChild(fig);
}
window.__ready = true;
</script>
</body>
</html>
